<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compilador de APK</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2420;--card:#fff;--line:#d9ddd6;--ac:#1f7a4d;--mut:#667068}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--fg:#e8ede9;--card:#1c241f;--line:#2e3a32;--ac:#4cc58a;--mut:#93a097}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:20px;max-width:560px;margin-inline:auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
small,a{color:var(--mut)}a{color:var(--ac)}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1.05rem;font-weight:700}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
pre{background:#0d120f;color:#b9f3d3;border-radius:8px;padding:12px;font-size:.8rem;max-height:220px;overflow:auto;white-space:pre-wrap;margin:0}
#res{display:none}
#res a.dl{display:block;text-align:center;padding:14px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;text-decoration:none}
</style></head><body>
<h1>Compilador de APK</h1>
<p class="s">Sube tu proyecto Android, espera y descarga el APK.</p>

<div class="box">
<label for="tok">Token de GitHub</label>
<input id="tok" type="password" autocomplete="off" placeholder="ghp_...">
<small><a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=APK%20Builder" target="_blank" rel="noopener">Crear token</a> con permisos repo y workflow. No se guarda en ningún sitio.</small>
</div>

<div class="box">
<label for="pick">Proyecto en .zip</label>
<input id="pick" type="file" accept=".zip,application/zip">
<small id="count">Elige el archivo .zip del proyecto (por ejemplo flappy-app.zip).</small>
</div>

<button id="go">Subir y compilar</button>

<div class="box" style="margin-top:12px"><pre id="log">Esperando...</pre></div>
<div class="box" id="res"><a class="dl" id="dl" href="#">Descargar APK</a><br><small id="rep"></small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const log=m=>{const l=$('log');l.textContent+='\n'+m;l.scrollTop=1e9};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let files=[],tok='';
$('pick').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('count').textContent='Leyendo zip...';
  try{
    const z=await JSZip.loadAsync(f);
    let list=Object.values(z.files).filter(x=>!x.dir);
    const tops=new Set(list.map(x=>x.name.split('/')[0]));
    const strip=tops.size===1&&list.every(x=>x.name.includes('/'));
    files=list.map(x=>({z:x,p:strip?x.name.split('/').slice(1).join('/'):x.name})).filter(x=>
      x.p&&!/^(\.git|\.gradle|build|\.idea)\//.test(x.p)&&!/\/build\//.test('/'+x.p)&&x.p!=='local.properties'&&!x.p.startsWith('__MACOSX'));
    $('count').textContent=files.length+' archivos listos';
  }catch(err){files=[];$('count').textContent='No pude leer el zip: '+err.message}
};
const WF=`name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
      - name: Release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          gh release create "v\${{ github.run_number }}" "$APK" --title "APK \${{ github.run_number }}"
`;
const gh=async(p,m='GET',b)=>{
  const r=await fetch('https://api.github.com'+p,{method:m,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:b?JSON.stringify(b):undefined});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));
  return r.status===204?null:r.json();
};
const b64=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(f)});

$('go').onclick=async()=>{
  tok=$('tok').value.trim();
  if(!tok)return alert('Pega tu token de GitHub.');
  if(!files.length)return alert('Elige el archivo .zip del proyecto.');
  $('go').disabled=true;$('res').style.display='none';$('log').textContent='Iniciando...';
  try{
    const me=await gh('/user');
    const name='apk-'+Date.now().toString(36);
    log('Creando repositorio '+name);
    const rp=await gh('/user/repos','POST',{name,auto_init:true,private:false});
    const base=`/repos/${me.login}/${name}`;
    await sleep(2500);
    const put=(path,content)=>gh(`${base}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,'PUT',{message:'add '+path,content});
    for(let i=0;i<files.length;i++){
      const f=files[i],p=f.p;
      log(`Subiendo ${i+1}/${files.length}: ${p}`);
      await put(p,await f.z.async('base64'));
      await sleep(350);
    }
    await put('.github/workflows/build.yml',btoa(unescape(encodeURIComponent(WF))));
    log('Iniciando compilación...');
    let ok=false;
    for(let t=0;t<6&&!ok;t++){
      try{await gh(`${base}/actions/workflows/build.yml/dispatches`,'POST',{ref:rp.default_branch});ok=true}
      catch(e){if(t==5)throw e;await sleep(5000)}
    }
    log('Compilando (puede tardar 3 a 10 minutos)...');
    let run=null;
    for(let t=0;t<180;t++){
      await sleep(10000);
      const rs=await gh(`${base}/actions/runs?event=workflow_dispatch`);
      run=rs.workflow_runs[0];
      if(run&&run.status==='completed')break;
      log('...'+(run?run.status:'en cola'));
    }
    if(!run||run.conclusion!=='success'){
      $('rep').innerHTML=run?`Falló la compilación. <a href="${run.html_url}" target="_blank" rel="noopener">Ver el error</a> y pégalo en el chat.`:'Se agotó el tiempo.';
      $('dl').style.display='none';$('res').style.display='block';
      throw new Error('La compilación no terminó bien.');
    }
    let url=null;
    for(let t=0;t<6&&!url;t++){
      try{const rel=await gh(`${base}/releases/latest`);url=rel.assets[0].browser_download_url}catch(e){await sleep(4000)}
    }
    if(!url)throw new Error('No encontré el APK en Releases.');
    log('Listo.');
    $('dl').href=url;$('dl').style.display='block';
    $('rep').innerHTML=`Repositorio: <a href="https://github.com/${me.login}/${name}" target="_blank" rel="noopener">${me.login}/${name}</a>`;
    $('res').style.display='block';
  }catch(e){log('Error: '+e.message)}
  $('go').disabled=false;
};
</script></body></html>
